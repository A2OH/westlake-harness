[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "westlake-apk-gap"
version = "0.2.0"
description = "Static Android APK compatibility scanner for the Westlake OpenHarmony runtime"
requires-python = ">=3.10"
dependencies = [
  "androguard>=4.1,<5",
  "pyelftools>=0.31,<1",
]

[project.scripts]
westlake-apk-gap = "westlake_gap.cli:main"

[tool.setuptools]
package-dir = {"" = "harness"}

[tool.setuptools.packages.find]
where = ["harness"]
